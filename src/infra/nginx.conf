server {
  listen 8080;

  gzip on;

  gzip_vary on;

  gzip_proxied any;

  gzip_comp_level 6;

  gzip_buffers 16 8k;

  gzip_min_length 0;

  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  location /api/ {
    # Resolve DNS at request time, not boot time (required for Cloud Map / Docker DNS).
    # __RESOLVERS__ is replaced at container startup by 25-set-resolver.sh.
    resolver __RESOLVERS__ valid=10s;
    resolver_timeout 5s;
    set $backend_url ${API_BACKEND_URL};
    proxy_pass http://$backend_url;
    # Use the backend hostname, not the incoming request's Host.
    # Prevents routing loops when an ALB uses Host-based routing.
    proxy_set_header Host $backend_url;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }
}
